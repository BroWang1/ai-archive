name: liveness
on:
  schedule:
    - cron: "17 6 * * *"   # daily
  workflow_dispatch:

concurrency:
  group: ai-archive-state
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  liveness:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            index
            config
            state
            scripts
            docs
          sparse-checkout-cone-mode: true
      - name: Check upstream repos
        id: check
        run: |
          set +e
          python3 scripts/liveness.py | tee liveness.log
          code=$?
          echo "transitions=$([ $code -eq 2 ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
          [ $code -eq 2 ] || [ $code -eq 0 ] || exit $code
      - name: Rebuild catalog and news
        run: python3 scripts/build_catalog.py
      - name: Commit state (heartbeat)
        # An empty commit still resets GitHub's 60-day scheduled-workflow
        # auto-disable clock — silence must never kill the monitor.
        run: |
          git config user.name "ai-archive-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A state/ index/ docs/
          git commit -m "heartbeat: liveness $(date -u +%F)" --allow-empty
          git pull --rebase --autostash origin main
          git push
      - name: Open issue on takedown
        if: steps.check.outputs.transitions == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Upstream status transition detected $(date -u +%F)" \
            --body "$(cat liveness.log)"
