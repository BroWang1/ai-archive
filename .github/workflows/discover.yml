name: discover
on:
  schedule:
    - cron: "43 7 * * 1,4"   # Mon + Thu
  workflow_dispatch:

concurrency:
  group: ai-archive-state
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  discover:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Scan tracked orgs and auto-capture new releases
        id: scan
        run: |
          set +e
          python3 scripts/discover.py --auto-capture 20 | tee discover.log
          code=$?
          echo "new=$([ $code -eq 3 ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
          [ $code -eq 3 ] || [ $code -eq 0 ] || exit $code
      - name: Scan global trending for untracked labs
        id: trend
        run: |
          set +e
          python3 scripts/trending.py | tee trending.log
          code=$?
          echo "trend=$([ $code -eq 4 ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
          [ $code -eq 4 ] || [ $code -eq 0 ] || exit $code
      - name: Watch lab GitHub orgs (radar)
        id: labgh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          python3 scripts/watch_github.py | tee labgh.log
          code=$?
          echo "labgh=$([ $code -eq 5 ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
          [ $code -eq 5 ] || [ $code -eq 0 ] || exit $code
      - name: Radar sources (arXiv + HN)
        id: radar
        run: |
          set +e
          python3 scripts/radar_sources.py | tee radar.log
          code=$?
          echo "radar=$([ $code -eq 6 ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
          [ $code -eq 6 ] || [ $code -eq 0 ] || exit $code
      - name: Rebuild catalog
        run: python3 scripts/build_catalog.py
      - name: Commit state (heartbeat)
        run: |
          git config user.name "ai-archive-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A state/ index/ snapshots/ docs/
          git commit -m "heartbeat: discover $(date -u +%F)" --allow-empty
          git pull --rebase --autostash origin main
          git push
      - name: Open issue on new releases
        if: steps.scan.outputs.new == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Auto-captured new releases $(date -u +%F)" \
            --body "$(cat discover.log)"
      - name: Open issue on new lab code
        if: steps.labgh.outputs.labgh == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Radar: new lab code on GitHub $(date -u +%F)" \
            --body "$(cat labgh.log)"
      - name: Open issue on trending outside tracked orgs
        if: steps.trend.outputs.trend == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Trending outside tracked labs $(date -u +%F)" \
            --body "$(cat trending.log)"
