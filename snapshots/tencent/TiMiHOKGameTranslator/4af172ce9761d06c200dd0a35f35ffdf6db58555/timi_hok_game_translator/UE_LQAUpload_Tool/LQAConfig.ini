[server]
; LQA 平台地址 (不要带结尾斜杠)
host = http://127.0.0.1:8080/api-pro
; 鉴权 Token, 留空时将尝试 dev 自动登录 (POST /api/user/login), 适合本地开发服务器
token = 

[project]
; 项目 ID / 任务 ID (必填)
project_id = 1
job_id = 1
; 模块 ID (可选, 留空则不提交)
module_id =
; 资源版本 (可选, 留空则使用 dump 内 meta.version)
resource_version =

[data]
; 待上传数据的根目录
root_path = ./data
; 目录扫描模式:
;   recursive = 递归遍历, 自动挑选所有含有效 dump 的目录 (兼容 xxx/LQA/... 嵌套结构)
;   flat      = 仅遍历 root_path 下的一级子目录
scan_mode = recursive

[options]
; 是否要求存在背景图 *_BG.png 才算有效记录 (true/false)
require_background = false
; 是否把背景图以 hex 写入 bg_data 字段上传 (true/false)
embed_background = false
; 是否要求存在 Texture_*.png 才算有效记录 (true/false)
require_texture = false
; 单条记录上传失败时的重试次数
retry_times = 1
