[tool.poetry]
name = "lqa-server"
version = "1.0.0"
description = "LQA 本地化质量检测平台 - 后端服务"
authors = ["LQA Contributors"]
license = "Apache-2.0"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
django = "^5.1.1"
mysqlclient = "^2.2.4"
django-environ = "^0.11.2"
orjson = "^3.10.7"
redis = "^5.0.8"
requests = "^2.32.3"
pydantic = "^2.9.1"
celery = "^5.4.0"
munch = "^4.0.0"
pyjwt = "^2.9.0"
pillow = "^10.4.0"
opencv-python-headless = "^4.10.0.84"
gunicorn = "^23.0.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
