# 一键部署: cp .env.example .env 修改密码后执行 docker compose up -d --build
# 访问 http://<服务器>:${LQA_HTTP_PORT:-8080}, 使用 LQA_ADMIN_USERNAME / LQA_ADMIN_PASSWORD 登录
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: lqa
      MYSQL_USER: lqa
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  server: &server
    build: ./server
    image: lqa-server:latest
    restart: unless-stopped
    environment: &server_env
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:?请在 .env 中设置 SECRET_KEY}
      ALLOWED_HOSTS: "*"
      MYSQL_URL: mysql://lqa:${MYSQL_PASSWORD}@mysql:3306/lqa
      REDIS_URL: rediscache://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/2
      CELERY_BACKEND_URL: redis://:${REDIS_PASSWORD}@redis:6379/2
      ALLOW_REGISTER: ${ALLOW_REGISTER:-true}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      PUBLIC_URL: ${PUBLIC_URL:-}
      MEDIA_PUBLIC: ${MEDIA_PUBLIC:-false}
      # 默认指向随本编排启动的 ai 服务; 如需用外部识别服务, 在 .env 中覆盖
      AI_BASE_URL: ${AI_BASE_URL:-http://ai:8086}
      LQA_ADMIN_USERNAME: ${LQA_ADMIN_USERNAME:-admin}
      LQA_ADMIN_PASSWORD: ${LQA_ADMIN_PASSWORD:-}
    volumes:
      - lqa_data:/data
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["web"]

  worker:
    <<: *server
    command: ["worker"]
    # AI 识别由 Celery worker 发起 (apps/image/service.py), 需等 ai 就绪
    depends_on:
      server:
        condition: service_started
      ai:
        condition: service_healthy

  ai:
    build:
      context: ./lqa_service
      args:
        # 内置的 OCR 引擎: rapidocr (默认, 轻量) / paddleocr (精度更高, 镜像约+2GB)
        # easyocr (多语种) / none (不内置, 需指向外部 OCR 服务)
        OCR_ENGINE: ${OCR_ENGINE:-rapidocr}
    image: lqa-ai:latest
    restart: unless-stopped
    environment:
      DEBUG_MODE: ${AI_DEBUG_MODE:-False}
      # OCR 为可选能力; 设为 none 则不做 OCR, 仅跳过错译与文本超框检测
      OCR_PROVIDER: ${OCR_PROVIDER:-rapidocr}
      OCR_LANG: ${OCR_LANG:-ch}
      GUNICORN_WORKERS: ${AI_WORKERS:-2}
      # 使用外部/云 OCR 时按需设置, 详见 lqa_service/README.md
      OCR_URL: ${OCR_URL:-}
      OCR_HOST: ${OCR_HOST:-}
      OCR_API_KEY: ${OCR_API_KEY:-}
      OCR_SECRET_ID: ${OCR_SECRET_ID:-}
      OCR_SECRET_KEY: ${OCR_SECRET_KEY:-}
      OCR_REGION: ${OCR_REGION:-ap-guangzhou}
    # 默认仅在内部网络暴露; 需从宿主机直接调试时在 .env 设置 AI_HTTP_PORT
    ports:
      - "${AI_HTTP_PORT:-127.0.0.1:8086}:8086"

  web:
    build: ./web
    image: lqa-web:latest
    restart: unless-stopped
    ports:
      - "${LQA_HTTP_PORT:-8080}:80"
    depends_on:
      - server

volumes:
  mysql_data:
  redis_data:
  lqa_data:
