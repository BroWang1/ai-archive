# 越南语语种 profile
id: vi_example
display_name: 越南语
source_locale: zh-CN
target_locale: vi

locale_names:
  cn: 越南语
  en: Vietnamese

# 源文件：路径相对于 ``vcs.local_path`` 下的 VCS 工作副本根。
# 对应 full 表自动推断为同目录下的 98.full.<ext>，无需显式配置。
source:
  format: json
  path: trunk/tests/fixtures/vi/99.incr.json

# VCS 配置留空 → 走 conf/config.yaml 的 vcs 段。
# 如需本语种独立 VCS，取消下方注释并填入；敏感字段建议走环境变量。
# vcs:
#   url: "svn://..."
#   local_path: svn/vi_dedicated

llm_profile: llama3_1_70b_example

# 通知渠道：企业微信群机器人
# 敏感字段：webhook 请通过环境变量注入 GAME_TRANS_TOOLCHAIN__NOTIFICATION__WEBHOOK
# mentioned 可填企业微信用户名，审校任务关键节点会 @ 这些人
notification:
  type: wecom
  webhook: "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=xxx"
  mentioned:
    - curry

# 审校配置
# ⚠️ Phrase 平台特性与已知限制详见 docs/platforms/phrase.md。
reviews:
  light:
    platform: crowdin
    project_name: VI_LightReview

  # 一审：Phrase TMS
  # 敏感字段：subject_token 不要写在这里，请走环境变量
  #   GAME_TRANS_TOOLCHAIN__PLATFORM__SUBJECT_TOKEN
  #   （来源：Phrase UI → Settings → API tokens → Generate token）
  first:
    platform: crowdin
    project_id: "your_project_id"                                  # Phrase project UID（URL /web/project2/show/<UID>）
    project_name: VI First Review (Crowdin)
    target_language_id: vi                          # Phrase 项目 targetLangs[0].code
    poll_interval_seconds: 60
    stop_time: "17:00"                              # 支持 "HH:MM" 绝对格式或 "+Nm/Nh" 相对格式
    extra:
      region: eu                                    # EU 账户走 eu.phrase.com

  # 二审：Crowdin
  # 敏感字段：api_token 走 config.yaml 的 platform.api_token（env 注入）
  second:
    platform: crowdin
    project_id: "your_project_id"
    project_name: VI Second Review (Crowdin)
    target_language_id: vi
    poll_interval_seconds: 60
    stop_time: "18:00"

# 工作流状态编排（按声明顺序执行）
workflow:
  - pull_vcs
  - last_first_review
  - last_second_review
  - last_merge_data
  - translate
  - update_tm
  - first_review
  - validate_data
  - merge_data
merge_start_time: ""

# 翻译策略配置
#   - class 可填短名 "TwoStepTranslationStrategy" / "two_step"，或完整 import 路径；
#   - 省略 class 则走装饰器注册表，再兜底 GenericTranslationStrategy（一步直译）。
#
# 两步翻译（中 → 英 → 越）：
#   - Step 1 注入中→英术语；Step 2 用英→越术语对注入，充分利用增量表的
#     en_terms / vi_terms 两列。
strategy_config:
  class: GenericTranslationStrategy
  display_name: 越南语翻译
  use_concurrent_by_default: true
  default_max_workers: 32
  progress_log_interval: 100
