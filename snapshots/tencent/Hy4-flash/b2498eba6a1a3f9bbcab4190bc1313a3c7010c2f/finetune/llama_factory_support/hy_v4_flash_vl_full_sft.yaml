### model
model_name_or_path: /path/to/hy4_flash_ckpt
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: full

deepspeed: ../deepspeed_support/ds_zero3_offload.json

### dataset
dataset_dir: .
dataset: hy_v4_flash_vl_demo
template: hy_v4_flash_vl
cutoff_len: 1024
max_samples: 1000
overwrite_cache: true
enable_thinking: true

### VL-specific settings
# LLaMA Factory will auto-detect the VL model and load the processor.
# image_base_dir is resolved relative to the dataset file location.
# freeze_vision_tower: freeze the ViT encoder during SFT (recommended)
freeze_vision_tower: true

### output
output_dir: saves/hy_v4_flash_vl/full/sft
logging_steps: 1
save_steps: 5
plot_loss: true
overwrite_output_dir: true
save_only_model: true
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 1
learning_rate: 1.0e-5
max_steps: 5
num_train_epochs: 3.0
lr_scheduler_type: cosine_with_min_lr
lr_scheduler_kwargs:
  min_lr_rate: 0.1
warmup_steps: 0
bf16: true
optim: adamw_torch
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: true
ddp_timeout: 180000000
flash_attn: auto
max_grad_norm: 0.0
resume_from_checkpoint: null
