default_stage:
  default_modifiers:
    AWQModifier:
      requires_calibration_data: true
      mappings:
      - smooth_layer: re:model\.language_model\.layers\.(3|7|11|15|19|23|27|31|35|39)\.input_layernorm$
        balance_layers: ['re:model\.language_model\.layers\.\d+\.self_attn\.q_proj$', 're:model\.language_model\.layers\.\d+\.self_attn\.k_proj$',
          're:model\.language_model\.layers\.\d+\.self_attn\.v_proj$']
        activation_hook_target: null
      - smooth_layer: re:model\.language_model\.layers\.(0|1|2|4|5|6|8|9|10|12|13|14|16|17|18|20|21|22|24|25|26|28|29|30|32|33|34|36|37|38)\.input_layernorm$
        balance_layers: ['re:model\.language_model\.layers\.\d+\.linear_attn\.in_proj_qkv$',
          're:model\.language_model\.layers\.\d+\.linear_attn\.in_proj_z$', 're:model\.language_model\.layers\.\d+\.linear_attn\.in_proj_b$',
          're:model\.language_model\.layers\.\d+\.linear_attn\.in_proj_a$']
        activation_hook_target: null
      - smooth_layer: re:model\.language_model\.layers\.\d+\.post_attention_layernorm$
        balance_layers: ['re:model\.language_model\.layers\.\d+\.mlp\.experts\.\d+\.gate_proj$',
          're:model\.language_model\.layers\.\d+\.mlp\.experts\.\d+\.up_proj$', 're:model\.language_model\.layers\.\d+\.mlp\.shared_expert_gate$',
          're:model\.language_model\.layers\.\d+\.mlp\.shared_expert\.gate_proj$', 're:model\.language_model\.layers\.\d+\.mlp\.shared_expert\.up_proj$']
        activation_hook_target: null
      - smooth_layer: re:model\.language_model\.layers\.\d+\.mlp\.experts\.\d+\.up_proj$
        balance_layers: ['re:model\.language_model\.layers\.\d+\.mlp\.experts\.\d+\.down_proj$']
        activation_hook_target: null
      offload_device: !!python/object/apply:torch.device [cpu]
      duo_scaling: both
      n_grid: 10
    QuantizationModifier:
      targets: [Linear]
      ignore: ['re:.*lm_head.*', 're:.*vision_tower.*', 're:.*vit_merger.*', 're:.*merger.*',
        're:.*self_attn.*', 're:.*linear_attn.*', 're:.*mlp\.gate$', 're:.*shared_expert.*',
        're:.*embed_tokens.*']
      scheme: W4A16
      bypass_divisibility_checks: false
      requires_calibration_data: false
